// CS2 bhop practice config: local/private server only (uses sv_cheats).
// Install: copy to Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// Use:     start a Practice match (or "map de_dust2" in console), then "exec bhop_practice"

sv_cheats 1
sv_enablebunnyhopping 1      // no speed cap when landing
sv_autobunnyhopping 1        // hold Space to hop on every landing
sv_staminajumpcost 0
sv_staminalandcost 0
sv_staminamax 0
sv_airaccelerate 100         // easier air strafing (default 12)
sv_maxvelocity 3500
r_drawothermodels 2          // see-thru: other players drawn as wireframe through walls
mp_freezetime 0
mp_roundtime_defuse 60
mp_restartgame 1

// Official/online servers: none of the above works there. For legit hopping,
// put these in autoexec.cfg to jump with the scroll wheel:
// bind "mwheeldown" "+jump"
// bind "mwheelup" "+jump"
