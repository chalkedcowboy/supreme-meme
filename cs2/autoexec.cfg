// CS2 official-server bhop binds (allowed by Valve; no cheats).
// Install: copy to Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//          (if you already have an autoexec.cfg, paste these lines into it)
// Steam > CS2 > Properties > Launch Options: +exec autoexec

bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "space" "+jump"
